<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>WBSync 会话</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#141414" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #141414; color: #e6e6e6;
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; background: #1d1d1d; border-bottom: 1px solid #2c2c2c;
      position: sticky; top: 0;
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; }
    header .conn { font-size: 12px; color: #9a9a9a; }
    button {
      background: #2b4a75; color: #cfe4ff; border: 0; border-radius: 8px;
      padding: 8px 14px; font-size: 14px; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
    main { flex: 1; overflow-y: auto; padding: 12px 16px 32px; }
    .row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 12px; border: 1px solid #2c2c2c; border-radius: 10px;
      margin-bottom: 8px; background: #1a1a1a; cursor: pointer;
    }
    .row.active { border-color: #4da3ff; }
    .row .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .meta { font-size: 12px; color: #9a9a9a; }
    .badge { font-size: 12px; border-radius: 6px; padding: 2px 8px; background: #262626; color: #bbb; flex: none; }
    .badge.running { background: #1d3a25; color: #7fd18c; }
    .badge.awaiting { background: #3a341d; color: #e0c67a; }
    .badge.failed { background: #3a1d1d; color: #e07a7a; }
    #stream { margin-top: 14px; }
    #stream h2 { font-size: 14px; color: #9a9a9a; margin: 0 0 8px; }
    .ev { padding: 8px 10px; border-left: 3px solid #4da3ff; background: #191919;
          border-radius: 0 8px 8px 0; margin-bottom: 6px; font-size: 13px; }
    .ev code { color: #8ab8e8; }
    .ev pre { margin: 4px 0 0; white-space: pre-wrap; word-break: break-all; color: #c9c9c9; font-size: 12px; }
    .hint { color: #777; font-size: 13px; padding: 16px 0; }
    #setup { padding: 12px 16px; background: #1d1d1d; border-bottom: 1px solid #2c2c2c;
             display: flex; gap: 8px; }
    #setup input, #newbar input { flex: 1; background: #111; color: #e6e6e6; border: 1px solid #2c2c2c;
                   border-radius: 8px; padding: 8px 10px; font-size: 14px; }
    #newbar { padding: 10px 16px; background: #191919; border-bottom: 1px solid #2c2c2c;
              display: flex; gap: 8px; }
    /* display:flex 会盖掉 UA 的 [hidden]{display:none}，必须显式提权重，否则 hidden 形同虚设 */
    #setup[hidden], #newbar[hidden], #stream[hidden] { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>WBSync 会话</h1>
    <span class="conn" id="conn">未连接</span>
    <button id="refresh">刷新</button>
  </header>
  <div id="setup">
    <input id="relayBase" placeholder="Relay 地址，如 http://192.168.x.x:8787" />
    <input id="pairCode" placeholder="6 位配对码" maxlength="6" inputmode="numeric"
           style="max-width:110px" autocomplete="one-time-code" />
    <button id="save">配对</button>
    <button id="forget" title="清除本机保存的令牌与设备 ID，清除后需重新配对">忘掉这台电脑</button>
  </div>
  <div id="newbar" hidden>
    <input id="newText" placeholder="第一句话（可选，空=建空会话）" />
    <button id="create">新建会话</button>
  </div>
  <main>
    <div id="status" class="hint" hidden></div>
    <div id="list" class="hint">填入 Relay 地址，再输入 PC 端（宿主插件本地页 /__wbsync/pair）生成的 6 位配对码。</div>
    <div id="stream" hidden>
      <h2 id="streamTitle">事件流</h2>
      <button id="cancel" title="取消该会话当前正在运行的轮次">取消当前轮次</button>
      <div id="compose">
        <input id="msgText" placeholder="向该会话发消息…" />
        <input id="file" type="file" />
        <button id="send">发送</button>
      </div>
      <div id="events"></div>
    </div>
  </main>

  <script type="module">
    import { createPwaClient } from '../src/client.js'
    import { pairWithRelay } from '../src/pairing.js'

    const $ = (id) => document.getElementById(id)
    let client = null
    let activeSession = null
    const seenSeq = new Map()   // sessionId -> 已渲染的最大 seq（幂等渲染）

    $('relayBase').value = localStorage.getItem('wbsync.base') ?? ''
    // 已配对过（localStorage 有令牌）就不再展示配对码输入，避免误触重新配对
    if (localStorage.getItem('wbsync.token')) $('pairCode').placeholder = '已配对（留空直接连接）'

    const say = (text, isError = false) => {
      const el = $('status')
      el.hidden = false
      el.textContent = text
      el.style.color = isError ? '#e07a7a' : '#7fd18c'
      // 反馈条在列表上方；用户滚到事件流区域点按钮时看不到，会误判成「点了没反应」。
      el.scrollIntoView({ block: 'center', behavior: 'smooth' })
    }

    const STATUS_TEXT = {
      connecting: '连接中', reconnecting: '重连中', following: '已订阅',
      gap: '补齐中', closed: '已关闭',
    }
    const connState = (snap) => {
      if (!snap) return '未连接'
      const f = snap.follows.find((x) => x.sessionId === activeSession)
      if (!f) return `已连接 · ${snap.sessions.length} 个会话`
      // -1 是「尚未收到事件」的内部哨兵值，不直接暴露给用户
      const seq = f.lastSeq < 0 ? '—' : `seq=${f.lastSeq}`
      return `${f.sessionId.slice(0, 18)}… · ${STATUS_TEXT[f.status] ?? f.status} · ${seq}`
    }

    const renderList = (rows) => {
      const box = $('list')
      box.classList.remove('hint')
      if (!rows.length) { box.innerHTML = '<span class="hint">PC 侧还没有上报会话索引。</span>'; return }
      box.innerHTML = ''
      for (const r of rows) {
        const div = document.createElement('div')
        div.className = 'row' + (r.sessionId === activeSession ? ' active' : '')
        div.innerHTML = `
          <div><div class="title">${r.title ?? r.sessionId}</div>
          <div class="meta">seq ${r.lastSeq ?? '?'} · ${r.lastActiveAt ? new Date(r.lastActiveAt).toLocaleString() : '—'}</div></div>
          <span class="badge ${r.state ?? ''}">${r.state ?? 'unknown'}</span>`
        div.addEventListener('click', () => openStream(r.sessionId))
        box.appendChild(div)
      }
    }

    // 连续同类型事件折叠成一行：流式输出会刷出成百条碎片，逐条铺开会把页面拉爆
    let fold = { type: null, from: 0, to: 0, count: 0, div: null, pre: null }
    const renderEvent = (sessionId, ev, source) => {
      if (sessionId !== activeSession) return
      const last = seenSeq.get(sessionId) ?? -1
      if (!Number.isInteger(ev?.seq) || ev.seq <= last) return   // 幂等渲染
      seenSeq.set(sessionId, ev.seq)
      const type = ev?.type ?? ev?.t ?? 'event'
      const detail = JSON.stringify(ev.data ?? ev, null, 1).slice(0, 400)
      if (fold.type === type && fold.div) {
        fold.to = ev.seq
        fold.count++
        fold.div.querySelector('code').textContent = `#${fold.from}–#${fold.to} ${type} ×${fold.count}`
        fold.pre.textContent = detail   // 折叠行始终显示最后一条的摘要
        return
      }
      const div = document.createElement('div')
      div.className = 'ev'
      div.innerHTML = `<code>#${ev.seq} ${type}${source === 'replay' ? ' · 补齐' : ''}</code><pre></pre>`
      const pre = div.querySelector('pre')
      pre.textContent = detail
      $('events').appendChild(div)
      fold = { type, from: ev.seq, to: ev.seq, count: 1, div, pre }
    }

    const openClient = (base, deviceId, token) => {
      client?.stop()
      seenSeq.clear()
      client = createPwaClient({
        baseUrl: base,
        deviceId,
        token,
        onEvent: ({ sessionId, ev, source }) => renderEvent(sessionId, ev, source),
        onNotice: (n) => { if (n.type === 'sessions') renderList(n.rows) },
        onStateChange: (snap) => { $('conn').textContent = connState(snap) },
      })
      client.refreshSessions()
        .then((rows) => {
          renderList(rows); $('list').classList.remove('hint'); $('status').hidden = true
          $('newbar').hidden = false   // 已连接才亮「新建会话」（Host 离线时协议要求入口置灰）
        })
        .catch((e) => say(`连接失败：${e.message}`, true))
    }

    /** 有码走配对，没码用已存令牌直连（刷新 / 回访场景）。 */
    const connect = async () => {
      const base = $('relayBase').value.trim().replace(/\/$/, '')
      const code = $('pairCode').value.trim()
      if (!base) { say('需要 Relay 地址。', true); return }
      let token = localStorage.getItem('wbsync.token')
      let deviceId = localStorage.getItem('wbsync.deviceId')
      if (code) {
        say('配对中…')
        try {
          const r = await pairWithRelay({ baseUrl: base, code })
          token = r.deviceToken
          deviceId = r.deviceId
          localStorage.setItem('wbsync.base', base)
          localStorage.setItem('wbsync.deviceId', deviceId)
          localStorage.setItem('wbsync.token', token)
          $('pairCode').value = ''
          $('pairCode').placeholder = '已配对（留空直接连接）'
          say(`已配对：${deviceId}`)
        } catch (e) {
          // 配对码是一次性的：/pair 成功即消费，输错码要回 PC 重新生成
          say(`配对失败：${e.message}（配对码一次性，请回 PC 重新生成）`, true)
          return
        }
      }
      if (!token || !deviceId) { say('输入 PC 端生成的 6 位配对码完成配对。', true); return }
      localStorage.setItem('wbsync.base', base)
      openClient(base, deviceId, token)
    }

    const openStream = async (sessionId) => {
      activeSession = sessionId
      seenSeq.set(sessionId, -1)
      // 切换会话必须清空折叠状态与旧事件，否则会跨会话合并、并残留上一个会话的内容
      fold = { type: null, from: 0, to: 0, count: 0, div: null, pre: null }
      $('events').innerHTML = ''
      $('stream').hidden = false
      $('streamTitle').textContent = `事件流 · ${sessionId}`
      for (const el of document.querySelectorAll('.row')) el.classList.remove('active')
      client.follow(sessionId, { sinceSeq: -1 })
      $('conn').textContent = connState(client.snapshot())
    }

    $('save').addEventListener('click', () => { void connect() })
    // 忘掉这台电脑：清掉本机令牌与设备 ID，回到未配对状态（此前只能靠清浏览器数据）
    $('forget').addEventListener('click', () => {
      if (!window.confirm('清除本机保存的令牌与设备 ID？清除后需要重新配对。')) return
      client?.stop()
      client = null
      for (const k of ['wbsync.token', 'wbsync.deviceId', 'wbsync.base']) localStorage.removeItem(k)
      activeSession = null
      fold = { type: null, from: 0, to: 0, count: 0, div: null, pre: null }
      $('events').innerHTML = ''
      $('stream').hidden = true
      $('newbar').hidden = true
      $('pairCode').value = ''
      $('pairCode').placeholder = '6 位配对码'
      $('conn').textContent = '未连接'
      say('已忘掉这台电脑，请重新配对')
    })
    $('refresh').addEventListener('click', () => client?.refreshSessions().catch((e) => say(`刷新失败：${e.message}`, true)))
    $('create').addEventListener('click', async () => {
      if (!client) return
      $('create').disabled = true
      try {
        const r = await client.createSession({ text: $('newText').value.trim() })
        $('newText').value = ''
        say(`已创建：${r.sessionId}`)
        openStream(r.sessionId)
      } catch (e) {
        say(`新建失败：${e.message}${e.code === 'HOST_OFFLINE' ? '（Host 离线）' : ''}`, true)
      } finally {
        $('create').disabled = false
      }
    })
    $('cancel').addEventListener('click', async () => {
      if (!client || !activeSession) return
      $('cancel').disabled = true
      try {
        await client.cancelTurn({ sessionId: activeSession })
        say(`已请求取消：${activeSession.slice(0, 18)}…`)
      } catch (e) {
        say(`取消失败：${e.message}${e.code === 'HOST_OFFLINE' ? '（Host 离线）' : ''}`, true)
      } finally {
        $('cancel').disabled = false
      }
    })
    $('send').addEventListener('click', async () => {
      if (!client || !activeSession) return
      const text = $('msgText').value.trim()
      const file = $('file').files?.[0] ?? null
      if (!text && !file) { say('需要文本或文件', true); return }
      $('send').disabled = true
      try {
        const attachments = []
        if (file) {
          const up = await client.uploadAttachment({ sessionId: activeSession, file })
          if (up?.receiptId) attachments.push(up.receiptId)
          say(`已上传：${file.name}（${up?.file?.bytes ?? '?'} B）`)
        }
        await client.submitPrompt({ sessionId: activeSession, text, attachments })
        $('msgText').value = ''
        $('file').value = ''
        say(`已发送${attachments.length ? '（含附件）' : ''}`)
      } catch (e) {
        say(`发送失败：${e.message}`, true)
      } finally {
        $('send').disabled = false
      }
    })
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {})
  </script>
</body>
</html>
