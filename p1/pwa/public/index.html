<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>WBSync 会话</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#141414" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #141414; color: #e6e6e6;
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; background: #1d1d1d; border-bottom: 1px solid #2c2c2c;
      position: sticky; top: 0;
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; }
    header .conn { font-size: 12px; color: #9a9a9a; }
    /* 多电脑切换：窄屏也要挤得下，所以给个上限并允许省略 */
    header #profile { max-width: 38%; background: #111; color: #cfe4ff; border: 1px solid #2c2c2c;
                      border-radius: 8px; padding: 6px 8px; font-size: 13px; }
    button {
      background: #2b4a75; color: #cfe4ff; border: 0; border-radius: 8px;
      padding: 8px 14px; font-size: 14px; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
    main { flex: 1; overflow-y: auto; padding: 12px 16px 32px; }
    .row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 12px; border: 1px solid #2c2c2c; border-radius: 10px;
      margin-bottom: 8px; background: #1a1a1a; cursor: pointer;
    }
    .row.active { border-color: #4da3ff; }
    /* 置顶分组（r11）：小标题 + 置顶开关，开关不挤走状态徽章 */
    .grouphead { margin: 10px 2px 6px; font-size: 12px; color: #7a8699; letter-spacing: .5px; }
    .pinbtn { background: none; border: none; cursor: pointer; font-size: 15px; padding: 4px 2px; opacity: .35; }
    .pinbtn.on { opacity: 1; }
    .row.archived { opacity: .62; }
    /* 内容区必须能收缩：内层 div 不设 min-width:0 时，长标题会把右侧状态徽章顶出屏幕 */
    .row > div { min-width: 0; flex: 1 1 auto; }
    .row .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .meta { font-size: 12px; color: #9a9a9a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge { font-size: 12px; border-radius: 6px; padding: 2px 8px; background: #262626; color: #bbb; flex: none; white-space: nowrap; }
    .badge.running { background: #1f3a2b; color: #7fd18c; }
    .badge.awaiting { background: #3d3320; color: #d9a03a; }
    .badge.failed { background: #3d2323; color: #e07a7a; }
    .badge.stopped { background: #262626; color: #9a9a9a; }
    .badge.running { background: #1d3a25; color: #7fd18c; }
    .badge.awaiting { background: #3a341d; color: #e0c67a; }
    .badge.failed { background: #3a1d1d; color: #e07a7a; }
    #stream { margin-top: 14px; }
    #stream h2 { font-size: 14px; color: #9a9a9a; margin: 0 0 8px; }
    .ev { padding: 8px 10px; border-left: 3px solid #4da3ff; background: #191919;
          border-radius: 0 8px 8px 0; margin-bottom: 6px; font-size: 13px; }
    .ev code { color: #8ab8e8; }
    .ev pre { margin: 4px 0 0; white-space: pre-wrap; word-break: break-all; color: #c9c9c9; font-size: 12px; }

    /* 转录：消息气泡 / 工具行 / 轮次分隔线 */
    .msg { max-width: 92%; padding: 8px 10px; border-radius: 10px; margin: 6px 0; white-space: pre-wrap; word-break: break-word; line-height: 1.55; }
    .msg.user { margin-left: auto; background: #1f3550; border: 1px solid #2b4a6e; }
    .msg.assistant { background: #171f29; border: 1px solid #2f3d50; }
    .msg .who { font-size: 11px; color: #9fb0c8; margin-bottom: 2px; }
    .msg .truncated { color: #d9a03a; font-size: 12px; }
    .ev.tool { border-left-color: #6b7c92; background: #141a22; color: #9fb0c8; font-size: 13px; padding: 6px 10px; }
    .ev.tool summary { cursor: pointer; color: #9fb0c8; }
    .ev.tool pre { max-height: 260px; overflow: auto; }
    .divider { color: #6b7c92; font-size: 12px; text-align: center; margin: 10px 0; }
    #earlier { display: block; width: 100%; margin: 0 0 10px; background: #1b2431; border: 1px solid #3a4658; color: #9fb0c8; }
    #earlier[hidden] { display: none; }
    .streambar { display: flex; gap: 8px; margin-bottom: 10px; }
    .streambar button { flex: 1; background: #1b2431; border: 1px solid #3a4658; color: #9fb0c8; }
    .streambar button[hidden] { display: none; }
    .streambar button.on { border-color: #4da3ff; color: #cfe3ff; }
    /* 「← 列表」按内容宽，把余下宽度留给翻页与噪声开关 */
    .streambar #back { flex: 0 0 auto; }
    /* 不认识的原始事件默认折叠：首屏不该被 JSON 淹没，想看再点开 */
    .ev > details > summary { cursor: pointer; color: #8ab8e8; }
    .ev > details > pre { max-height: 260px; overflow: auto; }
    .hint { color: #777; font-size: 13px; padding: 16px 0; }
    #setup { padding: 12px 16px; background: #1d1d1d; border-bottom: 1px solid #2c2c2c;
             display: flex; gap: 8px; }
    #setup input, #newbar input { flex: 1; background: #111; color: #e6e6e6; border: 1px solid #2c2c2c;
                   border-radius: 8px; padding: 8px 10px; font-size: 14px; }
    #newbar { padding: 10px 16px; background: #191919; border-bottom: 1px solid #2c2c2c;
              display: flex; gap: 8px; }
    /* display:flex 会盖掉 UA 的 [hidden]{display:none}，必须显式提权重，否则 hidden 形同虚设 */
    #setup[hidden], #newbar[hidden], #stream[hidden] { display: none; }

    /* 审批卡片：设备级，与当前看哪个会话无关 */
    #approvals { display: grid; gap: 8px; margin: 8px 0 12px; }
    #approvals[hidden] { display: none; }
    .card { border: 1px solid #3a4658; border-left: 3px solid #d9a03a; border-radius: 8px; padding: 10px 12px; background: #171f29; }
    .card .tool { font-weight: 600; }
    .card .why { color: #9fb0c8; font-size: 13px; margin: 4px 0 8px; white-space: pre-wrap; word-break: break-word; }
    .card .acts { display: flex; gap: 8px; }
    .card button.allow { background: #2b6a3f; border-color: #2b6a3f; }
    .card button.deny { background: #8b3030; border-color: #8b3030; }

    /* 产物卡片：只有元数据，点一下复制路径；文件字节留在电脑上 */
    #artifacts { display: grid; gap: 6px; margin: 10px 0; }
    #artifacts[hidden] { display: none; }
    #artifacts .head { color: #9fb0c8; font-size: 13px; margin-bottom: 2px; }
    .art { display: flex; align-items: center; gap: 8px; border: 1px solid #2f3d50; border-radius: 8px; padding: 8px 10px; background: #141c26; }
    .art .name { font-weight: 600; word-break: break-all; }
    .art .desc { color: #9fb0c8; font-size: 12px; word-break: break-word; }
    .art button { margin-left: auto; }
  </style>
</head>
<body>
  <header>
    <h1>WBSync 会话</h1>
    <!-- 多台电脑（W7）：下拉里每一条 = 一份配对档案；点号是这台电脑的在线状态 -->
    <select id="profile" title="切换电脑"></select>
    <span class="conn" id="conn">未连接</span>
    <button id="refresh">刷新</button>
  </header>
  <div id="setup">
    <input id="relayBase" placeholder="Relay 地址，如 http://192.168.x.x:8787" />
    <input id="pairCode" placeholder="6 位配对码" maxlength="6" inputmode="numeric"
           style="max-width:110px" autocomplete="one-time-code" />
    <button id="save">配对</button>
    <button id="forget" title="清除本机保存的令牌与设备 ID，清除后需重新配对">忘掉这台电脑</button>
  </div>
  <div id="newbar" hidden>
    <input id="newText" placeholder="第一句话（可选，空=建空会话）" />
    <button id="create">新建会话</button>
    <!-- r12：归档是软移除，入口收在这里，默认不占列表空间 -->
    <button id="archivedToggle" title="显示/收起已归档的会话">🗄 已归档</button>
  </div>
  <!-- 审批是设备级的（与当前看哪个会话无关），所以放在事件流之外 -->
  <div id="approvals" hidden></div>
  <main>
    <div id="status" class="hint" hidden></div>
    <div id="list" class="hint">填入 Relay 地址，再输入 PC 端（宿主插件本地页 /__wbsync/pair）生成的 6 位配对码。</div>
    <div id="stream" hidden>
      <h2 id="streamTitle">事件流</h2>
      <button id="cancel" title="取消该会话当前正在运行的轮次">取消当前轮次</button>
      <button id="archive" title="从列表藏起来，可在「已归档」里恢复，不删除日志">归档此会话</button>
      <div id="compose">
        <input id="msgText" placeholder="向该会话发消息…" />
        <input id="file" type="file" />
        <button id="send">发送</button>
      </div>
      <div id="artifacts" hidden></div>
      <div class="streambar">
        <button id="back">← 列表</button>
        <button id="earlier" hidden>加载更早</button>
        <button id="noise">显示插件事件</button>
      </div>
      <div id="events"></div>
    </div>
  </main>

  <script type="module">
    import { createPwaClient } from '../src/client.js'
    import { pairWithRelay } from '../src/pairing.js'
    import { classifyEvent, isPluginEvent, messageText, shortType } from '../src/transcript.js'

    const $ = (id) => document.getElementById(id)
    let client = null
    let activeSession = null
    const seenSeq = new Map()   // sessionId -> 已渲染的最大 seq（幂等渲染）
    const pendingApprovals = new Map()   // approvalId -> { toolName, reason, sessionId, expiresAt }
    let approvalsPulled = false          // 已按「进入 following」补拉过一次，避免每次状态抖动都打接口
    let restoredLastSession = false      // 「回到上次会话」只做一次：重连不该把人从当前会话里拽走

    /* ------------------------------------------------ 多电脑档案（W7） */
    // 一台手机可以配多台电脑：每台一份「档案」（地址 + 目标 Host + 令牌 + 本机身份）。
    // 切换电脑 = 切这份档案；令牌是逐台电脑各一枚，不会互相顶掉（r9）。
    const PROFILES_KEY = 'wbsync.profiles'
    const ACTIVE_KEY = 'wbsync.activeHost'
    const loadProfiles = () => {
      try {
        const raw = JSON.parse(localStorage.getItem(PROFILES_KEY) ?? '[]')
        if (Array.isArray(raw)) return raw.filter((p) => p && p.base && p.hostDeviceId && p.token)
      } catch { /* 坏数据当没有，别让页面起不来 */ }
      return []
    }
    let profiles = loadProfiles()
    // 老版本只存单台电脑的那几个键：迁移成一条档案，别让人重配一遍
    if (!profiles.length && localStorage.getItem('wbsync.token')) {
      const base = localStorage.getItem('wbsync.base')
      const hostDeviceId = localStorage.getItem('wbsync.deviceId')
      const token = localStorage.getItem('wbsync.token')
      if (base && hostDeviceId && token) {
        profiles = [{
          base, hostDeviceId, token,
          phoneId: localStorage.getItem('wbsync.phoneId'), label: null, online: null,
        }]
        localStorage.setItem(PROFILES_KEY, JSON.stringify(profiles))
        localStorage.setItem(ACTIVE_KEY, hostDeviceId)
      }
    }
    let activeProfile = profiles.find((p) => p.hostDeviceId === localStorage.getItem(ACTIVE_KEY)) ?? profiles[0] ?? null
    const saveProfiles = () => {
      try { localStorage.setItem(PROFILES_KEY, JSON.stringify(profiles)) } catch { /* 隐私模式 */ }
      if (activeProfile) {
        try { localStorage.setItem(ACTIVE_KEY, activeProfile.hostDeviceId) } catch { /* 同上 */ }
      }
    }
    /** 新增或更新一份档案。同一台电脑重配只换令牌，不会多出一条。 */
    const upsertProfile = (patch) => {
      const i = profiles.findIndex((p) => p.hostDeviceId === patch.hostDeviceId)
      if (i === -1) profiles.push({ online: null, label: null, ...patch })
      else profiles[i] = { ...profiles[i], ...patch }
      activeProfile = profiles.find((p) => p.hostDeviceId === patch.hostDeviceId) ?? profiles[0] ?? null
      saveProfiles()
      renderProfiles()
    }
    const removeProfile = (hostDeviceId) => {
      profiles = profiles.filter((p) => p.hostDeviceId !== hostDeviceId)
      activeProfile = profiles[0] ?? null
      saveProfiles()
      renderProfiles()
    }
    /**
     * 状态点六态（W7）：● 在线 / ◌ 连接中·重连中 / ✕ 失败 / ○ 离线 / ? 未探。
     * `live` 是**瞬时连接态**（来自客户端 follows 的状态机），`online` 是宿主侧事实
     * （来自 sessions 响应的 host.online）。两者不一致时，瞬时态优先——
     * 用户关心的是「现在能不能用」，不是「最后一次探测说了什么」。
     */
    const DOT_OF = { online: '●', connecting: '◌', reconnecting: '◌', failed: '✕', offline: '○' }
    const LIVE_LABEL = { online: '在线', connecting: '连接中', reconnecting: '重连中', failed: '失败', offline: '离线' }
    const dotOf = (p) => (p.live && DOT_OF[p.live]) || (p.online === true ? '●' : p.online === false ? '○' : '?')
    const liveLabel = (p) => (p.live && LIVE_LABEL[p.live])
      || (p.online === true ? '在线' : p.online === false ? '离线' : '未探')
    const renderProfiles = () => {
      const sel = $('profile')
      sel.innerHTML = ''
      if (!profiles.length) {
        const opt = document.createElement('option')
        opt.textContent = '未配对'
        opt.value = ''
        sel.appendChild(opt)
        sel.disabled = true
        return
      }
      sel.disabled = false
      for (const p of profiles) {
        const opt = document.createElement('option')
        opt.value = p.hostDeviceId
        // 名字优先用电脑自报的名字，没有就退化到地址——地址一定认得出来
        opt.textContent = `${dotOf(p)} ${p.label || p.base.replace(/^https?:\/\//, '')}`
        opt.title = liveLabel(p)      // 悬停/长按能看懂点号是什么意思
        sel.appendChild(opt)
      }
      if (activeProfile) sel.value = activeProfile.hostDeviceId
    }

    // 没有档案时，地址栏就是最好的默认值：用户是**从那个地址打开的页面**，它显然可达。
    // 这一行兜掉的是真机踩过的坑：从 100.x（Tailscale）打开，输入框却还写着 192.168 的旧地址。
    const originBase = (typeof location !== 'undefined' && location.origin && location.origin !== 'null') ? location.origin : ''
    $('relayBase').value = activeProfile?.base ?? (originBase || localStorage.getItem('wbsync.base') || '')
    // 已配对过（有档案）就不再展示配对码输入，避免误触重新配对
    if (activeProfile) $('pairCode').placeholder = '已配对（留空直接连接）'

    const say = (text, isError = false) => {
      const el = $('status')
      el.hidden = false
      el.textContent = text
      el.style.color = isError ? '#e07a7a' : '#7fd18c'
      // 反馈条在列表上方；用户滚到事件流区域点按钮时看不到，会误判成「点了没反应」。
      el.scrollIntoView({ block: 'center', behavior: 'smooth' })
    }

    const STATUS_TEXT = {
      connecting: '连接中', reconnecting: '重连中', following: '已订阅',
      gap: '补齐中', closed: '已关闭',
    }
    const connState = (snap) => {
      if (!snap) return '未连接'
      const f = snap.follows.find((x) => x.sessionId === activeSession)
      if (!f) return `已连接 · ${snap.sessions.length} 个会话`
      // -1 是「尚未收到事件」的内部哨兵值，不直接暴露给用户
      const seq = f.lastSeq < 0 ? '—' : `seq=${f.lastSeq}`
      return `${f.sessionId.slice(0, 18)}… · ${STATUS_TEXT[f.status] ?? f.status} · ${seq}`
    }

    // 会话列表用到的映射与小工具（徽章文案、短 id、工作区目录名）
    const STATE_LABEL = {
      running: '运行中', awaiting: '等待输入', stopped: '已停止',
      failed: '失败', completed: '已完成', unreadable: '不可读',
    }
    const shortId = (id) => String(id ?? '').replace(/^session-/, '').slice(0, 8)
    const workspaceName = (p) => {
      if (typeof p !== 'string' || !p.trim()) return null
      const clean = p.replace(/[\\/]+$/, '')
      const at = Math.max(clean.lastIndexOf('\\'), clean.lastIndexOf('/'))
      const tail = at === -1 ? clean : clean.slice(at + 1)
      return tail || null
    }

    // 已归档列表（r12）：默认折叠，展开时单独拉，不混入主列表缓存
    let showArchived = false
    let archivedRows = []

    /**
     * 会话列表：置顶在前（按宿主给的 pinnedOrder，最近置顶在前），其余按最近活跃。
     * 置顶是宿主的全局集合（r11），这里只负责分组显示与逐条置顶/取消——**不改序**。
     */
    const renderList = (rows) => {
      const box = $('list')
      box.classList.remove('hint')
      if (!rows.length) { box.innerHTML = '<span class="hint">PC 侧还没有上报会话索引。</span>'; return }
      box.innerHTML = ''
      const sorted = [...rows].sort((a, b) => {
        const pa = a.pinned ? 0 : 1
        const pb = b.pinned ? 0 : 1
        if (pa !== pb) return pa - pb
        if (a.pinned && b.pinned) return (a.pinnedOrder ?? 0) - (b.pinnedOrder ?? 0)
        return (b.lastActiveAt ?? 0) - (a.lastActiveAt ?? 0)
      })
      let lastGroup = null
      for (const r of sorted) {
        const group = r.pinned ? '置顶' : '全部'
        if (group !== lastGroup) {
          lastGroup = group
          const head = document.createElement('div')
          head.className = 'grouphead'
          head.textContent = group
          box.appendChild(head)
        }
        const div = document.createElement('div')
        div.className = 'row' + (r.sessionId === activeSession ? ' active' : '')

        const left = document.createElement('div')
        const title = document.createElement('div')
        title.className = 'title'
        // 索引里 title 常常是 null（宿主还没生成标题）。退回工作区目录名，比一串 session-xxx 好认；
        // 都拿不到才用短 id。全部 textContent——工作区路径来自 Host，不能当 HTML 拼。
        title.textContent = r.title || workspaceName(r.workspace) || shortId(r.sessionId)
        const meta = document.createElement('div')
        meta.className = 'meta'
        const when = r.lastActiveAt ? new Date(r.lastActiveAt).toLocaleString() : '—'
        meta.textContent = `${shortId(r.sessionId)} · seq ${r.lastSeq ?? '?'} · ${when}`
        left.appendChild(title); left.appendChild(meta)

        const badge = document.createElement('span')
        badge.className = `badge ${r.state ?? ''}`
        badge.textContent = STATE_LABEL[r.state] ?? (r.state ?? '未知')

        // 置顶开关：点它**只改置顶**，不能顺带把会话打开
        const pin = document.createElement('button')
        pin.className = 'pinbtn' + (r.pinned ? ' on' : '')
        pin.textContent = '📌'
        pin.title = r.pinned ? '取消置顶' : '置顶'
        pin.addEventListener('click', (e) => { e.stopPropagation(); void togglePin(r) })

        div.appendChild(left); div.appendChild(badge); div.appendChild(pin)
        div.addEventListener('click', () => openStream(r.sessionId))
        box.appendChild(div)
      }
      // 已归档（r12）：软移除，默认折叠；展开时给「恢复」，不给「删除」
      if (showArchived) {
        const head = document.createElement('div')
        head.className = 'grouphead'
        head.textContent = '已归档'
        box.appendChild(head)
        if (!archivedRows.length) {
          const empty = document.createElement('div')
          empty.className = 'hint'
          empty.textContent = '没有已归档的会话。'
          box.appendChild(empty)
        }
        for (const r of archivedRows) {
          const div = document.createElement('div')
          div.className = 'row archived'
          const left = document.createElement('div')
          const title = document.createElement('div')
          title.className = 'title'
          title.textContent = r.title || workspaceName(r.workspace) || shortId(r.sessionId)
          const meta = document.createElement('div')
          meta.className = 'meta'
          meta.textContent = `${shortId(r.sessionId)} · 归档`
          left.appendChild(title); left.appendChild(meta)
          const restore = document.createElement('button')
          restore.className = 'pinbtn'
          restore.textContent = '↩'
          restore.title = '恢复到列表'
          restore.addEventListener('click', (e) => { e.stopPropagation(); void restoreArchived(r.sessionId) })
          div.appendChild(left); div.appendChild(restore)
          box.appendChild(div)
        }
      }
    }

    /** 展开/收起已归档；展开时单独查，不覆盖列表缓存。 */
    const toggleArchived = async () => {
      if (!client) return
      showArchived = !showArchived
      $('archivedToggle').textContent = showArchived ? '🗄 收起归档' : '🗄 已归档'
      if (showArchived) {
        try { archivedRows = await client.getArchivedSessions() }
        catch (e) { archivedRows = []; say(`读取归档失败：${e.message}`, true) }
      }
      renderList(client.snapshot().sessions)
    }

    const restoreArchived = async (sessionId) => {
      if (!client) return
      try {
        await client.setArchived({ sessionId, archived: false })
        archivedRows = await client.getArchivedSessions()
        const rows = await client.refreshSessions()
        renderList(rows)
        say('已恢复到列表')
      } catch (e) { say(`恢复失败：${e.message}`, true) }
    }

    /** 置顶/取消置顶：成功后按宿主回的最新行刷新列表（排序跟着宿主走）。 */
    const togglePin = async (row) => {
      if (!client) return
      try {
        await client.setPinned({ sessionId: row.sessionId, pinned: !row.pinned })
        const rows = await client.refreshSessions()
        renderList(rows)
        say(row.pinned ? '已取消置顶' : '已置顶')
      } catch (e) {
        say(`置顶失败：${e.message}`, true)
      }
    }

    // 连续同类型事件折叠成一行：流式输出会刷出成百条碎片，逐条铺开会把页面拉爆
    let fold = { type: null, from: 0, to: 0, count: 0, div: null, pre: null }
    // 首屏只拉最近这么多条；更早的靠「加载更早」按需反向补读
    const EARLIER_WINDOW = 50
    let evBuf = new Map()      // seq -> ev（仅当前会话，供补读后整屏重绘）
    // seq -> 'live' | 'replay'：重绘时不能把来源一起抹掉，否则「补齐」标记会变成谎言
    let evOrigin = new Map()
    let windowStart = -1       // 屏幕最早一条的 seq；> 0 表示前面还有
    let showNoise = false      // 插件内部流量（plugin:*）默认隐藏，避免把首屏糊成 JSON
    let noiseHidden = 0        // 本轮渲染隐藏了几条，用来提示按钮

    /* ------------------------------------------------ 阅读位置（W6 前置） */
    // 滚动容器是 <main>（列表与事件流同处一列），不是 window
    const mainEl = document.querySelector('main')
    const gapKey = (sid) => `wbsync.gap.${sid}`
    /** 距底距离。存这个而不是 scrollTop：重进会话时内容长度会变（字节窗口），绝对位置没意义。 */
    const bottomGap = () => mainEl.scrollHeight - mainEl.scrollTop - mainEl.clientHeight
    const scrollToBottom = () => { mainEl.scrollTop = mainEl.scrollHeight }
    let followTail = true      // 贴底跟随：只对「本来就看着底部」的人才跟
    /** 记住当前会话读到哪（距底多少像素）。 */
    const saveScroll = () => {
      if (!activeSession) return
      try { localStorage.setItem(gapKey(activeSession), String(Math.max(0, Math.round(bottomGap())))) } catch { /* 隐私模式禁用存储 */ }
    }
    /** 回到上次的位置；没有记录（第一次打开）就到底部看最新。 */
    const restoreScroll = (sid) => {
      let saved = null
      try { saved = localStorage.getItem(gapKey(sid)) } catch { /* 同上 */ }
      const gap = saved === null ? null : Number(saved)
      if (gap === null || !Number.isFinite(gap)) { scrollToBottom(); followTail = true; return }
      mainEl.scrollTop = Math.max(0, mainEl.scrollHeight - mainEl.clientHeight - gap)
      followTail = gap < 48
    }
    // 用户自己往上翻时别把他拽回底部；滚回底部才恢复跟随
    mainEl.addEventListener('scroll', () => { followTail = bottomGap() < 48 }, { passive: true })
    // 切后台/关页也算「离开」，否则读到一半切走再回来会跳到底
    addEventListener('pagehide', saveScroll)
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') saveScroll()
    })
    // 只画一条，不做去重/记账：重绘时也走它
    const paint = (ev, source) => {
      const type = ev?.type ?? ev?.t ?? 'event'
      if (isPluginEvent(ev) && !showNoise) { noiseHidden++; return }
      // Host 会把超过软上限的事件降级成「元数据 + 正文前缀」，这里别把 marker 当正文铺开
      const truncated = ev?.data?.truncated === true
      const detail = truncated
        ? `（该事件正文 ${Math.round((ev.data.bytes ?? 0) / 1024)} KiB，超过单帧上限未转发；完整内容在电脑上）`
        : JSON.stringify(ev.data ?? ev, null, 1).slice(0, 400)
      const info = classifyEvent(ev)
      const appended = document.createElement('div')

      if (info.kind === 'message' && !truncated) {
        // 能读出正文才做气泡；读不出就走下面的原始渲染，宁可难看也不显示空气泡
        appended.className = `msg ${info.role}`
        const who = document.createElement('div')
        who.className = 'who'
        who.textContent = info.role === 'user' ? '我' : '助手'
        const body = document.createElement('div')
        body.textContent = messageText(ev) ?? ''
        appended.appendChild(who); appended.appendChild(body)
        fold = { type: null, from: 0, to: 0, count: 0, div: null, pre: null }
      } else if (info.kind === 'tool-call') {
        appended.className = 'ev tool'
        appended.textContent = `⚙ 调用 ${info.label ?? '工具'} · seq ${ev.seq}`
        fold = { type: null, from: 0, to: 0, count: 0, div: null, pre: null }
      } else if (info.kind === 'tool-result') {
        appended.className = 'ev tool'
        const box = document.createElement('details')
        const sum = document.createElement('summary')
        sum.textContent = truncated
          ? `工具结果 · 正文 ${Math.round((ev.data.bytes ?? 0) / 1024)} KiB 未转发`
          : `工具结果 · ${info.chars} 字 · seq ${ev.seq}`
        const pre = document.createElement('pre')
        pre.textContent = truncated ? detail : (messageText(ev) ?? '').slice(0, 4000)
        box.appendChild(sum); box.appendChild(pre)
        appended.appendChild(box)
        fold = { type: null, from: 0, to: 0, count: 0, div: null, pre: null }
      } else if (info.kind === 'turn-end') {
        appended.className = 'divider'
        appended.textContent = `— 本轮${info.reason ?? '结束'} · seq ${ev.seq}${source === 'replay' ? ' · 补齐' : ''} —`
        fold = { type: null, from: 0, to: 0, count: 0, div: null, pre: null }
      } else {
        // 不认识的事件：一行摘要 + 折叠的原始 JSON。首屏不该被 JSON 淹没。
        const label = `${shortType(ev)}${source === 'replay' ? ' · 补齐' : ''}`
        if (fold.type === type && fold.div) {
          fold.to = ev.seq
          fold.count++
          fold.div.querySelector('summary').textContent = `#${fold.from}–#${fold.to} ${label} ×${fold.count}`
          fold.pre.textContent = detail   // 折叠行始终显示最后一条的摘要
          return
        }
        appended.className = 'ev'
        const box = document.createElement('details')
        const sum = document.createElement('summary')
        sum.textContent = `#${ev.seq} ${label}`
        const pre = document.createElement('pre')
        pre.textContent = detail
        box.appendChild(sum); box.appendChild(pre)
        appended.appendChild(box)
        fold = { type, from: ev.seq, to: ev.seq, count: 1, div: appended, pre }
      }
      $('events').appendChild(appended)
    }

    /** 收到一条事件：去重 → 记账 → 入缓冲 → 画出来。 */
    const renderEvent = (sessionId, ev, source) => {
      if (sessionId !== activeSession) return
      const last = seenSeq.get(sessionId) ?? -1
      if (!Number.isInteger(ev?.seq) || ev.seq <= last) return   // 幂等渲染
      seenSeq.set(sessionId, ev.seq)
      evBuf.set(ev.seq, ev)
      evOrigin.set(ev.seq, source === 'replay' ? 'replay' : 'live')
      if (windowStart === -1 || ev.seq < windowStart) windowStart = ev.seq
      paint(ev, source)
      // 实时事件到达时贴底跟随；补读（replay）不动滚动位置
      if (followTail && source !== 'replay') scrollToBottom()
      updateEarlier()
      updateNoiseLabel()
    }

    /** 「加载更早」只在窗口起点 > 0 时出现；补到 0 就收起。 */
    const updateEarlier = () => {
      const btn = $('earlier')
      if (!btn) return
      btn.hidden = !(activeSession && windowStart > 0)
    }

    /** 插件事件开关：只影响显示，不影响数据——事件一直在 evBuf 里，随时能翻出来。 */
    const updateNoiseLabel = () => {
      const btn = $('noise')
      if (!btn) return
      // 没有插件事件时不放按钮：空按钮比隐藏更吵
      btn.hidden = !showNoise && noiseHidden === 0
      btn.classList.toggle('on', showNoise)
      btn.textContent = showNoise
        ? '隐藏插件事件'
        : (noiseHidden ? `显示插件事件（已隐藏 ${noiseHidden} 条）` : '显示插件事件')
    }

    /** 整屏重绘：补读到更早的事件后，按 seq 重排一次，比往 DOM 前面插更可靠。 */
    const rerender = () => {
      $('events').innerHTML = ''
      fold = { type: null, from: 0, to: 0, count: 0, div: null, pre: null }
      noiseHidden = 0
      for (const seq of [...evBuf.keys()].sort((a, b) => a - b)) {
        paint(evBuf.get(seq), evOrigin.get(seq) ?? 'replay')
      }
      updateEarlier()
      updateNoiseLabel()
    }

    /** 往上翻一页（50 条）。补读走 session/backfill，取的是紧邻窗口前面那一段。 */
    const loadEarlier = async () => {
      if (!client || !activeSession || windowStart <= 0) return
      const btn = $('earlier')
      btn.disabled = true
      const label = btn.textContent
      btn.textContent = '加载中…'
      try {
        const data = await client.backfill({ sessionId: activeSession, beforeSeq: windowStart, limit: 50 })
        let added = 0
        for (const ev of data.events ?? []) {
          if (!Number.isInteger(ev?.seq)) continue
          if (!evBuf.has(ev.seq)) added++
          evBuf.set(ev.seq, ev)
          // 翻上来的都是补读，标 replay；已有的保持原来源
          if (!evOrigin.has(ev.seq)) evOrigin.set(ev.seq, 'replay')
        }
        if (data.events?.length) windowStart = data.events[0].seq
        else windowStart = 0            // 前面没有了
        if (added) rerender()
        else updateEarlier()
      } catch (e) {
        say(`加载更早失败：${e.message}`, true)
      } finally {
        btn.disabled = false
        btn.textContent = label
        updateEarlier()
      }
    }

    const openClient = (base, deviceId, token) => {
      client?.stop()
      seenSeq.clear()
      client = createPwaClient({
        baseUrl: base,
        deviceId,
        token,
        onEvent: ({ sessionId, ev, source }) => {
          renderEvent(sessionId, ev, source)
          if (ev?.type === 'deliverables/presented') scheduleArtifactRefresh(sessionId)
        },
        onNotice: (n) => {
          if (n.type === 'sessions') renderList(n.rows)
          if (n.type === 'approval') { pendingApprovals.set(n.approvalId, n); renderApprovals() }
          if (n.type === 'approval-resolved') {
            if (pendingApprovals.delete(n.approvalId)) renderApprovals()
            // 电脑上先答了：卡片撤掉，并说清是谁处理的，别让人以为自己点丢了
            if (n.by === 'host') say('该审批已在电脑上处理')
          }
        },
        onStateChange: (snap) => {
          $('conn').textContent = connState(snap)
          syncProfileLive(snap)
          // 重连回来补拉审批：断线期间 Host 可能发过审批，那时的推送已经丢了
          const following = Boolean(snap?.follows?.some((f) => f.status === 'following'))
          if (following && !approvalsPulled) { approvalsPulled = true; void refreshApprovals() }
          if (!following) approvalsPulled = false
        },
      })
      client.refreshSessions()
        .then((rows) => {
          renderList(rows); $('list').classList.remove('hint'); $('status').hidden = true
          $('newbar').hidden = false   // 已连接才亮「新建会话」（Host 离线时协议要求入口置灰）
          void refreshApprovals()      // 推送只保证「更快」，拉取才保证「断线期间的不漏」
          syncProfileStatus()
          // 回到上次那个会话：刷新页面 / 重开 PWA 后不必每次都从列表里再点一遍。
          // 只做一次，且那个会话必须还在索引里（被删了就老实停在列表）。
          if (!restoredLastSession) {
            restoredLastSession = true
            let last = null
            try { last = localStorage.getItem('wbsync.lastSession') } catch { /* 隐私模式 */ }
            if (!activeSession && last && rows.some((r) => r.sessionId === last)) void openStream(last)
          }
        })
        .catch((e) => say(`连接失败：${e.message}`, true))
    }

    /** 把当前连接探到的电脑状态记回档案（只更新在线/名字，不碰令牌）。 */
    const syncProfileStatus = () => {
      const host = client?.getHostStatus?.()
      if (!host || !activeProfile || host.deviceId !== activeProfile.hostDeviceId) return
      activeProfile.online = host.online === true
      if (host.name) activeProfile.label = host.name
      saveProfiles()
      renderProfiles()
    }

    /**
     * 状态点六态的「瞬时」半边：从客户端 follows 的状态机推导
     * online / connecting / reconnecting / failed；宿主侧 offline 优先
     * （电脑都不在了，界面再说「连接中」就是在骗人）。
     */
    const syncProfileLive = (snap) => {
      if (!activeProfile) return
      let live = null
      if (activeProfile.online === false) {
        live = 'offline'
      } else {
        const follows = snap?.follows ?? []
        const st = follows.map((f) => f.status)
        if (st.includes('following')) live = 'online'
        else if (st.includes('gap') || st.includes('refill-failed')) live = 'failed'
        else if (follows.length) {
          live = follows.some((f) => (f.attempts ?? 0) > 0) ? 'reconnecting' : 'connecting'
        }
      }
      if (live !== activeProfile.live) {
        activeProfile.live = live
        renderProfiles()
      }
    }

    /** 切到另一台电脑：断开旧的订阅，按新档案重连。 */
    const switchProfile = (hostDeviceId) => {
      const next = profiles.find((p) => p.hostDeviceId === hostDeviceId)
      if (!next || next === activeProfile) return
      saveScroll()                       // 先记住旧会话读到哪
      client?.stop()
      client = null
      if (activeProfile) activeProfile.live = null   // 旧档案不再有实时连接，状态点回「未探」
      activeProfile = next
      saveProfiles()
      renderProfiles()
      activeSession = null
      evBuf = new Map(); evOrigin = new Map(); windowStart = -1
      $('events').innerHTML = ''
      $('stream').hidden = true
      $('relayBase').value = next.base
      say(`已切到 ${next.label || next.base}`)
      openClient(next.base, next.hostDeviceId, next.token)
    }

    /** 渲染待审批卡片。设备级：不随 activeSession 变化。 */
    const renderApprovals = () => {
      const box = $('approvals')
      box.innerHTML = ''
      if (!pendingApprovals.size) { box.hidden = true; return }
      box.hidden = false
      for (const a of pendingApprovals.values()) {
        const card = document.createElement('div')
        card.className = 'card'

        const tool = document.createElement('div')
        tool.className = 'tool'
        tool.textContent = `需要审批：${a.toolName ?? '未知工具'}`
        card.appendChild(tool)

        const why = document.createElement('div')
        why.className = 'why'
        const left = a.expiresAt ? Math.max(0, Math.round((a.expiresAt - Date.now()) / 1000)) : null
        const sid = a.sessionId ? `会话 ${String(a.sessionId).slice(0, 14)}…` : '会话未知'
        why.textContent = [a.reason, sid, left === null ? null : `${left}s 后交给电脑`].filter(Boolean).join(' · ')
        card.appendChild(why)

        const acts = document.createElement('div')
        acts.className = 'acts'
        const allow = document.createElement('button')
        allow.className = 'allow'
        allow.textContent = '允许一次'
        allow.onclick = () => answerApproval(a.approvalId, 'allowed-once', [allow, deny])
        const deny = document.createElement('button')
        deny.className = 'deny'
        deny.textContent = '拒绝'
        deny.onclick = () => answerApproval(a.approvalId, 'rejected', [allow, deny])
        acts.appendChild(allow); acts.appendChild(deny)
        card.appendChild(acts)
        box.appendChild(card)
      }
    }

    /**
     * 应答一条审批。先答先得：409 APPROVAL_GONE 说明电脑端已经处理，
     * 这不是错误，撤卡并说明即可，别把「别人先答了」报成失败。
     */
    const answerApproval = async (approvalId, outcome, buttons = []) => {
      for (const b of buttons) b.disabled = true
      try {
        await client.answerApproval({ approvalId, outcome })
        pendingApprovals.delete(approvalId)
        renderApprovals()
        say(outcome === 'allowed-once' ? '已允许（单次）' : '已拒绝')
      } catch (e) {
        if (e.code === 'APPROVAL_GONE') {
          pendingApprovals.delete(approvalId)
          renderApprovals()
          say('该审批已在电脑上处理')
          return
        }
        for (const b of buttons) b.disabled = false
        say(`审批应答失败：${e.message}`, true)
      }
    }

    /** 拉全量待审批：WS 推送丢了、手机刚解锁、重连回来，都靠这一条补。 */
    const refreshApprovals = async () => {
      if (!client) return
      try {
        const rows = await client.listApprovals()
        pendingApprovals.clear()
        for (const r of rows) pendingApprovals.set(r.approvalId, r)
        renderApprovals()
      } catch { /* 拉不到就等推送，不打断主流程 */ }
    }

    /** 有码走配对，没码用已存令牌直连（刷新 / 回访场景）。 */
    let pairing = false
    const connect = async () => {
      const base = $('relayBase').value.trim().replace(/\/$/, '')
      const code = $('pairCode').value.trim()
      if (!base) { say('需要 Relay 地址。', true); return }
      // 同一地址可能已经是一份档案：有就复用它的本机身份，没有就是「新增一台电脑」
      let profile = profiles.find((p) => p.base === base) ?? null
      if (code) {
        // 连点两下会把码白白吃掉：/pair 一消费就作废，第二次必然报「码错误或过期」，
        // 而真正的原因（第一次已经用掉了）根本看不出来。
        if (pairing) return
        pairing = true
        $('save').disabled = true
        say('配对中…')
        try {
          // 两段式配对：先 /pair 拿到 hostDeviceId，再按「这台电脑」找回旧的本机身份。
          // 这样换地址（192.168 → 100.x）重配还是同一台手机，不会多出一行僵尸记录。
          const r = await pairWithRelay({
            baseUrl: base, code,
            phoneIdFor: (hostDeviceId) =>
              profiles.find((p) => p.hostDeviceId === hostDeviceId)?.phoneId ?? profile?.phoneId ?? null,
            // 只给管理台看「这是谁的手机」用，不参与任何判定；取不到就退回「浏览器」
            clientName: (/iPad/i.test(navigator.userAgent) ? 'iPad'
              : /iPhone/i.test(navigator.userAgent) ? 'iPhone'
                : /Android/i.test(navigator.userAgent) ? 'Android 手机' : '浏览器'),
          })
          // 写档案（不是写全局键）：后配的电脑不会覆盖先配的那台
          upsertProfile({
            base, hostDeviceId: r.deviceId, token: r.deviceToken,
            phoneId: r.phoneId ?? profile?.phoneId ?? null,
          })
          profile = activeProfile
          $('pairCode').value = ''
          $('pairCode').placeholder = '已配对（留空直接连接）'
          say(`已配对：${r.deviceId}`)
        } catch (e) {
          // 配对码是一次性的：/pair 成功即消费，输错码要回 PC 重新生成
          say(`配对失败：${e.message}（配对码一次性，请回 PC 重新生成）`, true)
          return
        } finally {
          pairing = false
          $('save').disabled = false
        }
      }
      if (!profile) { say('输入 PC 端生成的 6 位配对码完成配对。', true); return }
      openClient(profile.base, profile.hostDeviceId, profile.token)
    }

    /**
     * 产物卡片：只渲染 Host 给的元数据，绝不把文件字节搬过来。
     * 用 textContent 而不是 innerHTML——路径由宿主的日志来，不该被当成 HTML 执行。
     */
    let artifactRows = []
    let artifactTimer = null
    const renderArtifacts = () => {
      const box = $('artifacts')
      box.innerHTML = ''
      if (!artifactRows.length) { box.hidden = true; return }
      box.hidden = false
      const head = document.createElement('div')
      head.className = 'head'
      head.textContent = `本会话产物 · ${artifactRows.length} 个（文件仍在电脑工作区；下载是显式动作，一次性票据）`
      box.appendChild(head)

      for (const a of artifactRows) {
        const row = document.createElement('div')
        row.className = 'art'
        const name = document.createElement('span')
        name.className = 'name'
        name.textContent = a.name ?? a.path ?? '未命名'
        row.appendChild(name)
        if (a.description) {
          const desc = document.createElement('span')
          desc.className = 'desc'
          desc.textContent = a.description
          row.appendChild(desc)
        }
        const copy = document.createElement('button')
        copy.textContent = '复制路径'
        copy.onclick = async () => {
          try {
            await navigator.clipboard.writeText(a.path ?? '')
            say('路径已复制')
          } catch {
            say(`路径：${a.path ?? ''}`)
          }
        }
        row.appendChild(copy)
        // 下载（ADR-011）：显式动作 → 一次性票据 → Blob。转换格式宿主不支持，
        // 这里只做原样下载，不伪造 PDF/DOCX。
        const dl = document.createElement('button')
        dl.textContent = '下载'
        dl.onclick = async () => {
          if (!client || !activeSession || !a.path) return
          dl.disabled = true
          try {
            const t = await client.createArtifactTicket({ sessionId: activeSession, path: a.path })
            const blob = await client.fetchArtifactBlob({ ticketId: t.ticketId })
            const url = URL.createObjectURL(blob)
            const link = document.createElement('a')
            link.href = url
            link.download = t.name || a.name || 'artifact'
            document.body.appendChild(link)
            link.click()
            link.remove()
            setTimeout(() => URL.revokeObjectURL(url), 5000)
            say(`已下载 ${link.download}（${t.size} B）`)
          } catch (e) {
            say(`下载失败：${e.message}`, true)
          } finally { dl.disabled = false }
        }
        row.appendChild(dl)
        box.appendChild(row)
      }
    }

    /** 主动问一次 Host：显式呈现过的文件在会话日志里，晚连 / 缓冲被裁也能补回来。 */
    const refreshArtifacts = async (sessionId = activeSession) => {
      if (!client || !sessionId) return
      try {
        const rows = await client.getArtifacts({ sessionId })
        if (sessionId !== activeSession) return   // 用户已经切走了，旧响应别盖上来
        artifactRows = rows
        renderArtifacts()
      } catch { /* 产物读不到不打断事件流 */ }
    }

    /** 连续几条呈现事件合并成一次刷新，避免回放时把 Host 打一串重复请求。 */
    const scheduleArtifactRefresh = (sessionId) => {
      if (artifactTimer) clearTimeout(artifactTimer)
      artifactTimer = setTimeout(() => { artifactTimer = null; void refreshArtifacts(sessionId) }, 300)
    }

    const openStream = async (sessionId) => {
      if (!client) return
      // 离开上一个会话前先记住读到哪：DOM 马上就要被清空，晚一步就只剩 0
      if (activeSession && activeSession !== sessionId) saveScroll()
      activeSession = sessionId
      try { localStorage.setItem('wbsync.lastSession', sessionId) } catch { /* 隐私模式 */ }
      seenSeq.set(sessionId, -1)
      evBuf = new Map()
      evOrigin = new Map()
      windowStart = -1
      noiseHidden = 0
      artifactRows = []
      renderArtifacts()
      // 切换会话必须清空折叠状态与旧事件，否则会跨会话合并、并残留上一个会话的内容
      fold = { type: null, from: 0, to: 0, count: 0, div: null, pre: null }
      $('events').innerHTML = ''
      $('stream').hidden = false
      // 标题用会话名，不用裸 UUID——uuid 是给机器对账的，不是给人看的
      const meta0 = client.getSession?.(sessionId) ?? null
      $('streamTitle').textContent =
        `事件流 · ${meta0?.title || workspaceName(meta0?.workspace) || shortId(sessionId)}`
      for (const el of document.querySelectorAll('.row')) el.classList.remove('active')

      // 首屏窗口交给 Host 按**字节预算**裁（最近一页），不再由客户端数 50 条：
      // 固定条数管不住体积，50 条大事件能有 2 MB。拿不到 lastSeq 才退回条数窗口。
      const meta = client.getSession?.(sessionId) ?? null
      const known = Number.isInteger(meta?.lastSeq) ? meta.lastSeq : -1
      let after = -1
      let win = null
      try { win = await client.openWindow({ sessionId, lastSeq: known }) } catch { win = null }
      if (win?.events?.length) {
        for (const ev of win.events) renderEvent(sessionId, ev, 'replay')
        after = win.toSeq
      } else {
        windowStart = known > EARLIER_WINDOW ? known - EARLIER_WINDOW : -1
        after = windowStart
      }
      // 从这里往后接实时流：窗口内的已经画过，不重复
      client.follow(sessionId, { sinceSeq: after })
      void refreshArtifacts(sessionId)
      updateEarlier()
      updateNoiseLabel()
      // 首屏画完再定位：内容高度此时才是确定的（第一次打开 → 到底部看最新）
      restoreScroll(sessionId)
      $('conn').textContent = connState(client.snapshot())
    }

    /** 从事件流回到列表：记住读到哪，列表里保持这一行高亮（不取消选中）。 */
    const backToList = () => {
      saveScroll()
      followTail = false
      mainEl.scrollTop = 0
      const row = document.querySelector('.row.active')
      if (row) row.scrollIntoView({ block: 'center' })
    }

    $('archivedToggle').addEventListener('click', () => { void toggleArchived() })
    $('back').addEventListener('click', backToList)

    $('earlier').addEventListener('click', () => { void loadEarlier() })
    $('noise').addEventListener('click', () => { showNoise = !showNoise; rerender() })

    $('save').addEventListener('click', () => { void connect() })
    $('profile').addEventListener('change', (e) => switchProfile(e.target.value))
    // 忘掉**当前这台**电脑：只删这一份档案，别的电脑不受影响（多电脑时代的前提）
    $('forget').addEventListener('click', () => {
      const target = activeProfile
      if (!target) { say('当前没有已配对的电脑。', true); return }
      const name = target.label || target.base
      if (!window.confirm(`忘掉这台电脑（${name}）？本机需要重新配对才能再连它。`)) return
      client?.stop()
      client = null
      for (const k of ['wbsync.token', 'wbsync.deviceId', 'wbsync.base', 'wbsync.phoneId', 'wbsync.lastSession']) localStorage.removeItem(k)
      // 每个会话一条阅读位置，也得一起清：换一台电脑后 sessionId 全变了，留着只是垃圾
      for (const k of Object.keys(localStorage)) if (k.startsWith('wbsync.gap.')) localStorage.removeItem(k)
      activeSession = null
      evBuf = new Map()
      evOrigin = new Map()
      windowStart = -1
      artifactRows = []
      renderArtifacts()
      pendingApprovals.clear()
      renderApprovals()
      fold = { type: null, from: 0, to: 0, count: 0, div: null, pre: null }
      $('events').innerHTML = ''
      $('stream').hidden = true
      $('newbar').hidden = true
      $('pairCode').value = ''
      $('pairCode').placeholder = '6 位配对码'
      $('conn').textContent = '未连接'
      if (target) removeProfile(target.hostDeviceId)
      say(profiles.length ? `已忘掉 ${name}，还剩 ${profiles.length} 台电脑` : '已忘掉所有电脑，请重新配对')
    })
    $('refresh').addEventListener('click', () => client?.refreshSessions().catch((e) => say(`刷新失败：${e.message}`, true)))
    $('create').addEventListener('click', async () => {
      if (!client) return
      $('create').disabled = true
      try {
        const r = await client.createSession({ text: $('newText').value.trim() })
        $('newText').value = ''
        say(`已创建：${r.sessionId}`)
        openStream(r.sessionId)
      } catch (e) {
        say(`新建失败：${e.message}${e.code === 'HOST_OFFLINE' ? '（Host 离线）' : ''}`, true)
      } finally {
        $('create').disabled = false
      }
    })
    $('archive').addEventListener('click', async () => {
      if (!client || !activeSession) return
      if (!window.confirm('归档这个会话？它会从列表消失，可在「已归档」里恢复（不删除日志）。')) return
      try {
        await client.setArchived({ sessionId: activeSession, archived: true })
        activeSession = null
        evBuf = new Map(); evOrigin = new Map(); windowStart = -1
        $('events').innerHTML = ''
        $('stream').hidden = true
        if (showArchived) archivedRows = await client.getArchivedSessions()
        const rows = await client.refreshSessions()
        renderList(rows)
        say('已归档（可在「🗄 已归档」里恢复）')
      } catch (e) {
        say(`归档失败：${e.message}`, true)
      }
    })
    $('cancel').addEventListener('click', async () => {
      if (!client || !activeSession) return
      $('cancel').disabled = true
      try {
        await client.cancelTurn({ sessionId: activeSession })
        say(`已请求取消：${activeSession.slice(0, 18)}…`)
      } catch (e) {
        say(`取消失败：${e.message}${e.code === 'HOST_OFFLINE' ? '（Host 离线）' : ''}`, true)
      } finally {
        $('cancel').disabled = false
      }
    })
    $('send').addEventListener('click', async () => {
      if (!client || !activeSession) return
      const text = $('msgText').value.trim()
      const file = $('file').files?.[0] ?? null
      if (!text && !file) { say('需要文本或文件', true); return }
      $('send').disabled = true
      try {
        const attachments = []
        if (file) {
          const up = await client.uploadAttachment({ sessionId: activeSession, file })
          if (up?.receiptId) attachments.push(up.receiptId)
          say(`已上传：${file.name}（${up?.file?.bytes ?? '?'} B）`)
        }
        await client.submitPrompt({ sessionId: activeSession, text, attachments })
        $('msgText').value = ''
        $('file').value = ''
        say(`已发送${attachments.length ? '（含附件）' : ''}`)
      } catch (e) {
        say(`发送失败：${e.message}`, true)
      } finally {
        $('send').disabled = false
      }
    })
    renderProfiles()
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {})
  </script>
</body>
</html>
